<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sketchy — open source CAD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20x=%224%22%20y=%224%22%20width=%2256%22%20height=%2256%22%20rx=%2214%22%20fill=%22%23169b62%22/%3E%3Cpath%20d=%22M40%2022C36%2017%2024%2018%2024%2026C24%2034%2040%2030%2040%2039C40%2047%2027%2048%2022%2042%22%20fill=%22none%22%20stroke=%22%23fff%22%20stroke-width=%227%22%20stroke-linecap=%22round%22/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <aside id="data-panel"></aside>
    <div id="main">
      <header id="appbar">
        <div class="ab-left">
          <button class="abtn" id="btn-home" title="Show Home"></button>
          <button class="abtn" id="btn-data" title="Show Data Panel"></button>
          <span class="ab-gap"></span>
          <button class="abtn wide" id="btn-menu" title="File"></button>
          <button class="abtn wide" id="btn-undo" title="Undo (Ctrl+Z)"></button>
          <button class="abtn wide" id="btn-redo" title="Redo (Ctrl+Shift+Z)"></button>
        </div>
        <div id="doc-tabs" role="group" aria-label="Open designs"></div>
        <div class="ab-right">
          <button class="abtn" id="btn-newtab" title="New design"></button>
          <button class="abtn" id="btn-ext" title="Extensions"></button>
          <button class="abtn" id="btn-bell" title="Notifications"></button>
          <button id="btn-acct" class="avatar" title="Account"></button>
        </div>
      </header>
      <section id="toolrow">
        <button id="btn-workspace" title="Workspace"></button>
        <div id="toolwrap">
          <nav id="tabs"></nav>
          <section id="ribbon"></section>
        </div>
      </section>
      <main id="workspace">
        <div id="viewport">
          <canvas id="gl"></canvas>
          <aside id="browser">
            <div class="panel-title"><span class="pt-l" id="pt-collapse"></span><span>BROWSER</span><span class="pt-r" id="pt-min"></span></div>
            <div id="tree"></div>
          </aside>
          <div id="viewcube"><div id="cube"></div><svg id="cube-axes" viewBox="0 0 110 110" width="110" height="110"></svg><svg id="vc-rolls" viewBox="-100 -100 200 200" width="200" height="200"></svg><button id="cube-home" title="Home"></button><button id="cube-menu" title="View options"></button><button class="vc-arrow" data-t="y,-90" id="vc-l" title="Look from the left"></button><button class="vc-arrow" data-t="y,90" id="vc-r" title="Look from the right"></button><button class="vc-arrow" data-t="x,-90" id="vc-u" title="Look from above"></button><button class="vc-arrow" data-t="x,90" id="vc-d" title="Look from below"></button></div>
          <div id="manip-tip" hidden></div><div id="manip-label" hidden><span class="grip"></span><input type="text" inputmode="decimal" autocomplete="off" spellcheck="false"><span class="dots"></span></div>
          <div id="props-wrap"></div>
          <div id="banner" hidden></div>
          <div id="hud"></div>
          <div id="navbar"></div>
          <div id="statusbar"></div>
          <div class="zwin" id="zwin"></div>
        </div>
      </main>
      <footer id="timeline-bar">
        <div id="tl-controls"></div>
        <div id="timeline"></div>
        <button id="tl-settings" title="Timeline settings"></button>
      </footer>
    </div>
  </div>
  <div id="menu" class="popup" hidden></div>
  <div id="marking" hidden></div>
  <div id="toast" hidden></div>
  <input type="file" id="file-stl" accept=".stl" hidden />
  <input type="file" id="file-2d" hidden />
  <input type="file" id="file-proj" accept=".json,.sketchy" hidden />
  <script type="module" src="/src/main.js"></script>
</body>
</html>
