services:
  sketchy:
    image: ghcr.io/thatguy-za/sketchy:latest
    container_name: sketchy
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # set to "false" once your users have signed up
      ALLOW_REGISTRATION: "true"
    volumes:
      - sketchy-data:/data

volumes:
  sketchy-data:
