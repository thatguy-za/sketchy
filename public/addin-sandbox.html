<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Add-in sandbox</title></head>
<body><script>// The page every add-in runs in: a sandboxed iframe (no same-origin access, so no cookies, storage or app pages) served with a
// policy that allows no network. All it does is start the add-in's worker from the runtime text the app sends, and pass messages
// between that worker and the app. The add-in's own code never runs in this page, only in the worker.
(() => {
  let worker = null;
  const toParent = (m) => parent.postMessage(m, '*');
  addEventListener('message', (e) => {
    if (e.source !== parent) return;
    const m = e.data;
    if (!m || m.ch !== 'sketchy') return;
    if (m.type === 'boot') {
      if (worker) return;
      const url = URL.createObjectURL(new Blob([m.runtime], { type: 'text/javascript' }));
      worker = new Worker(url, { type: 'module' });
      worker.onmessage = (ev) => toParent(ev.data);
      worker.onerror = (ev) => toParent({ ch: 'sketchy', type: 'crash', message: String(ev.message || 'The add-in stopped with an error') });
      const { runtime, ...rest } = m; void runtime;
      worker.postMessage(rest);
    } else if (worker) worker.postMessage(m);
  });
  toParent({ ch: 'sketchy', type: 'frame-ready' });
})();</script></body></html>
